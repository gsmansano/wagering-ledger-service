services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  ministack:
    image: ministackorg/ministack:1.5.27
    ports:
      - "4566:4566"
    # The image ships its own healthcheck against /_ministack/health.

  # One-shot: applies pending migrations, then exits. App instances wait for it,
  # so several instances never migrate the schema concurrently.
  migrate:
    build: .
    command: ["bun", "src/infrastructure/database/migrate.ts", "up"]
    environment:
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
      SQS_ENDPOINT: http://ministack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      ministack:
        condition: service_healthy

volumes:
  postgres-data:
